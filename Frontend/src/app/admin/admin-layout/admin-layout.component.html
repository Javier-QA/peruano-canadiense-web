<div class="admin-shell" [class.nav-open]="navAbierto()" [attr.data-paleta]="paleta()" [attr.data-modo]="modo()">
  <app-toast-host />
  <app-admin-sidebar></app-admin-sidebar>
  <button
    type="button"
    class="admin-scrim"
    aria-label="Cerrar el menú"
    (click)="navAbierto.set(false)"
  ></button>
  <div class="admin-body">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="admin-burger"
          [attr.aria-expanded]="navAbierto()"
          [attr.aria-label]="
            colapsado() ? 'Expandir el menú de secciones' : 'Contraer el menú de secciones'
          "
          (click)="alternarNav()"
        >
          <i class="fa" [class.fa-angles-right]="colapsado()" [class.fa-angles-left]="!colapsado()" aria-hidden="true"></i>
        </button>
        <span class="topbar-heads">
          <h2 class="topbar-title">{{ pageTitle() }}</h2>
          <span class="topbar-date">{{ hoy }}</span>
        </span>
      </div>

      <div class="topbar-right">
        <button type="button" class="theme-toggle" (click)="alternarModo($event)" [attr.aria-label]="modo() === 'claro' ? 'Activar modo oscuro' : 'Activar modo claro'" [attr.title]="modo() === 'claro' ? 'Modo oscuro' : 'Modo claro'" [attr.aria-pressed]="modo() === 'oscuro'">
          @if (modo() === 'oscuro') {
            <svg class="theme-line-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          } @else {
            <svg class="theme-line-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1Z"/></svg>
          }
        </button>
      <div class="usermenu">
        <button
          type="button"
          class="usermenu-trigger"
          [class.is-open]="menuAbierto()"
          (click)="alternarMenu()"
          [attr.aria-expanded]="menuAbierto()"
          aria-haspopup="menu"
        >
          <span class="topbar-avatar" aria-hidden="true">{{ iniciales() }}</span>
          <span class="usermenu-id">
            <span class="usermenu-name">{{ usuario()?.nombre ?? 'Sesión' }}</span>
            <span class="usermenu-role">{{ rolEtiqueta() }}</span>
          </span>
          <i class="fa fa-chevron-down usermenu-caret" aria-hidden="true"></i>
        </button>

        @if (menuAbierto()) {
          <div class="usermenu-pop" role="menu">
            <div class="usermenu-pop-head">
              <span class="usermenu-name">{{ usuario()?.nombre ?? 'Sesión' }}</span>
              <span class="usermenu-role">{{ rolEtiqueta() }}</span>
            </div>
            <a routerLink="/admin/mi-cuenta" class="usermenu-item" role="menuitem">
              <i class="fa fa-user-gear" aria-hidden="true"></i> Mi cuenta
            </a>
            <button
              type="button"
              class="usermenu-item usermenu-item--danger"
              role="menuitem"
              (click)="cerrarSesion()"
            >
              <i class="fa fa-right-from-bracket" aria-hidden="true"></i> Cerrar sesión
            </button>
          </div>
        }
      </div>
      </div>
    </header>
    <main class="admin-main" [attr.data-admin-route]="rutaActual()">
      <router-outlet></router-outlet>
    </main>
  </div>
  <app-dialog
  [open]="confirmarSalida()"
  title="Cerrar sesión"
  variant="logout"
  (openChange)="confirmarSalida.set($event)"
>
  <p>¿Deseas cerrar sesión del panel administrativo? Tendrás que iniciar sesión nuevamente para volver a acceder.</p>
  <div dialog-footer>
    <button type="button" class="btn-cancel" (click)="confirmarSalida.set(false)">Cancelar</button>
    <button type="button" class="btn-danger" (click)="confirmarCerrarSesion()">Cerrar sesión</button>
  </div>
</app-dialog>
</div>
